# Vạn Linh Đảo — server game của Beta Holding (bản chính thức, chạy web, đăng nhập Google)
name = "van-linh-dao"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Bản web của game (thư mục dist do Vite build ra) được phục vụ cùng một địa chỉ
[assets]
directory = "../dist"

[vars]
# Client ID OAuth loại "Web application" tạo trong Google Cloud Console (xem README)
GOOGLE_CLIENT_ID = ""
# "1" = bật nút "Đăng nhập thử" khi chạy local. Bản chính thức để "0".
DEV_LOGIN = "0"
# "1" = cho phép tăng tốc thời gian để test. Bản chính thức để "0".
ALLOW_SPEED = "0"
# Bí mật (không ghi ở đây, đặt bằng lệnh):
#   npx wrangler secret put SESSION_SECRET   (chuỗi ngẫu nhiên dài ≥ 32 ký tự)
#   npx wrangler secret put ADMIN_TOKEN      (mật khẩu đọc thống kê, góp ý)

[[durable_objects.bindings]]
name = "HAI_KHU"
class_name = "HaiKhu"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HaiKhu"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]

[observability]
enabled = true
