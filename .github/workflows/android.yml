# Build file APK Android (không cần Android SDK, chỉ cần Java).
# Chạy tay: Actions → Build APK → Run workflow, hoặc tự chạy khi gắn tag v*.
# APK là bản thử nghiệm chơi trên máy (bản chính thức đăng nhập Google chỉ chạy trên web).
# Bản phát hành: thêm secret KEYSTORE_BASE64, KEYSTORE_PASS (và KEY_ALIAS nếu khác "betaholding").
name: Build APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - name: Giải mã keystore (nếu có)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > release.keystore && echo "KEYSTORE=$PWD/release.keystore" >> "$GITHUB_ENV"; fi
      - run: bash tools/build-apk.sh
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ vars.KEY_ALIAS }}
      - uses: actions/upload-artifact@v4
        with:
          name: van-linh-dao-apk
          path: build/van-linh-dao.apk
