# Kiểm tra mỗi lần đẩy code: test, kiểm kiểu, build bản web chính thức.
# Việc đưa lên mạng do Cloudflare tự làm (Workers Builds nối thẳng với repo này), không cần khoá trong GitHub.
name: Kiểm tra
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Thử đóng gói server (không đưa lên)
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry
