# Mỗi lần đẩy code lên nhánh main: chạy test rồi đưa server + bản web chính thức (đăng nhập Google) lên Cloudflare.
# Cần 2 secret trong GitHub: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Tuỳ chọn biến (Variables) GOOGLE_CLIENT_ID nếu không ghi thẳng trong server/wrangler.toml
name: Deploy Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: npm ci
        working-directory: server
      - name: Đưa lên Cloudflare
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GCID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Chưa có secret CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID nên bỏ qua bước đưa lên Cloudflare (test và build vẫn chạy)."
            exit 0
          fi
          EXTRA=""
          if [ -n "$GCID" ]; then EXTRA="--var GOOGLE_CLIENT_ID:$GCID"; fi
          npx wrangler deploy $EXTRA
